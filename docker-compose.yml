# ODS Invoicing — local Docker Desktop stack.
#
# Secrets are injected at runtime from Infisical; nothing sensitive lives on disk:
#   INFISICAL_DOMAIN=https://secrets.thatdeveloper.dev \
#   infisical run --env=dev --path=/ -- docker compose up -d
#
# Cloudflare Tunnel routes (must match Docker DNS names on ods_net):
#   api-pay.ohhdennyservices.com    -> bff:8080          (Netlify proxies /api here)
#   admin-pay.ohhdennyservices.com  -> ninja-nginx:80
#   pay.ohhdennyservices.com        -> Netlify (SPA); optional local: portal-edge:80
#
# No host ports are published: all inbound traffic arrives through cloudflared.

name: ods-invoicing

networks:
  ods_net:
    name: ods_invoicing_net

volumes:
  app_public:
  app_storage:
  mysql_data:
  redis_data:

services:
  # ---------------------------------------------------------------- Invoice Ninja
  app:
    image: invoiceninja/invoiceninja-debian:${IN_TAG:-latest}
    container_name: ods-ninja-app
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:-https://admin-pay.ohhdennyservices.com}
      APP_KEY: ${APP_KEY:?APP_KEY missing - set it in Infisical}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-true}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      IS_DOCKER: "true"
      PDF_GENERATOR: snappdf
      PHANTOMJS_PDF_GENERATION: "false"
      SCOUT_DRIVER: "null"
      FILESYSTEM_DISK: debian_docker
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "null"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-ninja}
      DB_USERNAME: ${DB_USERNAME:-ninja}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing - set it in Infisical}
      # Only needed for the very first boot; remove from Infisical afterwards.
      IN_USER_EMAIL: ${IN_USER_EMAIL:-}
      IN_PASSWORD: ${IN_PASSWORD:-}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-ohhdennyservicesllc@gmail.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-OhhDenny Services}
    volumes:
      - app_public:/var/www/html/public
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ods_net

  ninja-nginx:
    image: nginx:alpine
    container_name: ninja-nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/ninja:/etc/nginx/conf.d:ro
      - app_public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    # After `app` recreates, restart nginx once so upstream DNS is fresh
    # (also mitigated in laravel.conf via Docker DNS resolver).
    networks:
      ods_net:
        aliases:
          - ninja-nginx

  mysql:
    image: mysql:8
    container_name: ods-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ninja}
      MYSQL_USER: ${DB_USERNAME:-ninja}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD missing}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${DB_USERNAME:-ninja}",
          "-p${DB_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ods_net

  redis:
    image: redis:alpine
    container_name: ods-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ods_net

  # ---------------------------------------------------------------- Client portal
  bff:
    build:
      context: ./apps/bff
    image: ods-invoicing/bff:local
    container_name: ods-bff
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      PORTAL_ORIGIN: ${PORTAL_ORIGIN:-https://pay.ohhdennyservices.com}
      NINJA_BASE_URL: ${NINJA_INTERNAL_URL:-http://ninja-nginx}
      NINJA_PUBLIC_URL: ${APP_URL:-https://admin-pay.ohhdennyservices.com}
      # Set after first admin boot. Until then use "pending" so the container can start.
      NINJA_API_TOKEN: ${NINJA_API_TOKEN:-pending}
      SESSION_SECRET: ${BFF_SESSION_SECRET:?BFF_SESSION_SECRET missing - generate one and store it in Infisical}
      REDIS_URL: redis://redis:6379
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-ohhdennyservicesllc@gmail.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-OhhDenny Services}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ods_net

  portal-edge:
    build:
      context: ./apps/portal
    image: ods-invoicing/portal:local
    container_name: portal-edge
    restart: unless-stopped
    volumes:
      - ./infra/nginx/portal/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bff
    networks:
      ods_net:
        aliases:
          - portal-edge

  # ---------------------------------------------------------------- Cloudflare
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ods-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN missing - store the Zero Trust tunnel token in Infisical}
    networks:
      - ods_net
