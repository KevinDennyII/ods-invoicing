# Invoice Ninja (Laravel) served over the Cloudflare Tunnel.
# TLS terminates at Cloudflare, so this listener stays plain HTTP on the Docker network.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;

    # Invoice Ninja sets X-Frame-Options itself; only add what it does not.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    index index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Re-resolve Docker DNS so a restarted app container does not leave nginx
        # pointing at a stale IP (that produced Cloudflare 502s).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ninja_app app;
        fastcgi_pass $ninja_app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # cloudflared forwards the original scheme; Laravel needs it to build https URLs.
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
